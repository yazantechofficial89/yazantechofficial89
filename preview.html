<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>GitHub Profile Animated Preview</title>
  <style>
    body {
      background-color: #0d1117;

      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 940px;
      width: 100%;
    }
    .banner {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 30px;
      text-align: center;
    }
    .banner h1 {
      margin: 0 0 8px 0;
      color: #58a6ff;
      font-size: 24px;
    }
    .banner p {
      margin: 0;
      color: #8b949e;
      font-size: 14px;
    }
    .svg-wrapper {
      margin-bottom: 24px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
