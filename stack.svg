<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#111322" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#a78bfa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0d0e16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="orbitGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2438" />
    </pattern>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Core Pulsing Animation */
    @keyframes corePulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #22d3ee); }
    }
    .atom-core {
      animation: corePulse 3s infinite ease-in-out;
      transform-origin: 190px 210px;
    }

    /* Primary Orbit Rotations */
    @keyframes orbitRotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitRotate2 {
      from { transform: rotate(120deg); }
      to { transform: rotate(480deg); }
    }
    @keyframes orbitRotate3 {
      from { transform: rotate(240deg); }
      to { transform: rotate(600deg); }
    }

    .orbit-ring-1 {
      animation: orbitRotate1 16s infinite linear;
      transform-origin: 190px 210px;
    }
    .orbit-ring-2 {
      animation: orbitRotate2 22s infinite linear;
      transform-origin: 190px 210px;
    }
    .orbit-ring-3 {
      animation: orbitRotate3 18s infinite linear;
      transform-origin: 190px 210px;
    }

    /* Moons orbiting React */
    @keyframes moonOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .moon-system {
      animation: moonOrbit 5s infinite linear;
      transform-origin: 0px 0px;
    }

    /* Counter-rotation to keep icons upright */
    @keyframes counterRotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .counter-rot-1 {
      animation: counterRotate1 16s infinite linear;
      transform-origin: 0 0;
    }
    .counter-rot-2 {
      animation: counterRotate1 22s infinite linear;
      transform-origin: 0 0;
    }
    .counter-rot-3 {
      animation: counterRotate1 18s infinite linear;
      transform-origin: 0 0;
    }

    /* Sequentially glowing chip borders */
    @keyframes chipGlow {
      0%, 100% { stroke: #252d47; stroke-width: 1; }
      50% { stroke: #22d3ee; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(34, 211, 238, 0.4)); }
    }
    @keyframes chipGlowViolet {
      0%, 100% { stroke: #252d47; stroke-width: 1; }
      50% { stroke: #a78bfa; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(167, 139, 250, 0.4)); }
    }
    @keyframes chipGlowPink {
      0%, 100% { stroke: #252d47; stroke-width: 1; }
      50% { stroke: #f472b6; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(244, 114, 182, 0.4)); }
    }

    .chip-glow-1 { animation: chipGlow 4s infinite 0.2s; }
    .chip-glow-2 { animation: chipGlow 4s infinite 0.8s; }
    .chip-glow-3 { animation: chipGlowViolet 4s infinite 1.4s; }
    .chip-glow-4 { animation: chipGlowViolet 4s infinite 2.0s; }
    .chip-glow-5 { animation: chipGlowPink 4s infinite 2.6s; }
    .chip-glow-6 { animation: chipGlowPink 4s infinite 3.2s; }
    ]]>
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="416" rx="20" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.5" />
  <rect x="2" y="2" width="916" height="416" rx="20" fill="url(#dotGrid)" opacity="0.4" />

  <!-- Background Ambient Glow -->
  <circle cx="190" cy="210" r="160" fill="#22d3ee" opacity="0.06" filter="url(#neonBlur)" />
  <circle cx="680" cy="200" r="160" fill="#a78bfa" opacity="0.05" filter="url(#neonBlur)" />

  <!-- ================= LEFT: 3D TILTED ATOM TECH ORBIT ================= -->
  <g id="tech-atom">
    <!-- Orbit 1 Ellipse: Tilted -30 deg -->
    <g transform="translate(190, 210) rotate(-30)">
      <ellipse cx="0" cy="0" rx="145" ry="60" fill="none" stroke="url(#orbitGrad1)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75" />
    </g>

    <!-- Orbit 2 Ellipse: Tilted 30 deg -->
    <g transform="translate(190, 210) rotate(30)">
      <ellipse cx="0" cy="0" rx="150" ry="62" fill="none" stroke="url(#orbitGrad2)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75" />
    </g>

    <!-- Orbit 3 Ellipse: Tilted 90 deg -->
    <g transform="translate(190, 210) rotate(90)">
      <ellipse cx="0" cy="0" rx="140" ry="58" fill="none" stroke="url(#orbitGrad3)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75" />
    </g>

    <!-- Glowing Core -->
    <circle cx="190" cy="210" r="28" fill="url(#coreGlow)" class="atom-core" />
    <circle cx="190" cy="210" r="10" fill="#ffffff" opacity="0.9" filter="url(#glowSmall)" />

    <!-- Planet 1 System: React + 2 Moons (Orbit 1) -->
    <g class="orbit-ring-1">
      <g transform="translate(325, 210)">
        <!-- React Planet Core -->
        <circle cx="0" cy="0" r="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="1.5" />
        <g class="counter-rot-1">
          <!-- React Atom Icon -->
          <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#22d3ee" stroke-width="1" />
          <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#22d3ee" stroke-width="1" transform="rotate(60)" />
          <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#22d3ee" stroke-width="1" transform="rotate(120)" />
          <circle cx="0" cy="0" r="2" fill="#22d3ee" />
        </g>

        <!-- Two Orbiting Moons (Next.js & Zustand) -->
        <g class="moon-system">
          <!-- Moon 1: Next.js -->
          <circle cx="28" cy="0" r="7" fill="#000000" stroke="#ffffff" stroke-width="0.8" />
          <text x="28" y="2.5" fill="#ffffff" class="font-sans" font-size="6" font-weight="900" text-anchor="middle">N</text>

          <!-- Moon 2: TypeScript -->
          <circle cx="-28" cy="0" r="7" fill="#3178c6" stroke="#ffffff" stroke-width="0.8" />
          <text x="-28" y="2.5" fill="#ffffff" class="font-sans" font-size="6" font-weight="900" text-anchor="middle">TS</text>
        </g>
      </g>

      <!-- Planet 2: Node.js (opposite on orbit 1) -->
      <g transform="translate(55, 210)">
        <circle cx="0" cy="0" r="16" fill="#0a1a0e" stroke="#10b981" stroke-width="1.5" />
        <g class="counter-rot-1">
          <text x="0" y="4" fill="#34d399" class="font-sans" font-size="10" font-weight="800" text-anchor="middle">JS</text>
        </g>
      </g>
    </g>

    <!-- Planet 3: Python (Orbit 2) -->
    <g class="orbit-ring-2">
      <g transform="translate(330, 210)">
        <circle cx="0" cy="0" r="16" fill="#1b1d2a" stroke="#a78bfa" stroke-width="1.5" />
        <g class="counter-rot-2">
          <!-- Python Icon Glyphs -->
          <path d="M -5 -6 C -5 -8 -3 -9 0 -9 C 3 -9 5 -8 5 -6 L 5 -3 L -1 -3 L -1 -1 L 5 -1 C 7 -1 8 0 8 3 C 8 5 7 6 5 6 L 3 6 L 3 3 L -3 3 C -5 3 -6 2 -6 -1 L -6 -6 Z"
                fill="#a78bfa" transform="scale(0.8) translate(0, 0)" />
        </g>
      </g>

      <!-- Planet 4: Docker -->
      <g transform="translate(50, 210)">
        <circle cx="0" cy="0" r="15" fill="#0b1b2d" stroke="#38bdf8" stroke-width="1.5" />
        <g class="counter-rot-2">
          <!-- Whale / Docker Containers -->
          <rect x="-6" y="-3" width="3" height="3" fill="#38bdf8" />
          <rect x="-2" y="-3" width="3" height="3" fill="#38bdf8" />
          <rect x="2" y="-3" width="3" height="3" fill="#38bdf8" />
          <rect x="-2" y="-7" width="3" height="3" fill="#38bdf8" />
        </g>
      </g>
    </g>

    <!-- Planet 5: PostgreSQL (Orbit 3) -->
    <g class="orbit-ring-3">
      <g transform="translate(320, 210)">
        <circle cx="0" cy="0" r="15" fill="#19172d" stroke="#f472b6" stroke-width="1.5" />
        <g class="counter-rot-3">
          <text x="0" y="4" fill="#f472b6" class="font-sans" font-size="9" font-weight="800" text-anchor="middle">SQL</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: GROUPED CHIP GRID ================= -->
  <g transform="translate(410, 28)">
    <!-- Header -->
    <text x="0" y="16" fill="#22d3ee" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">// TECH ORBIT &amp; ECOSYSTEM</text>
    <text x="0" y="42" fill="#f8fafc" class="font-sans" font-size="22" font-weight="800">Stack &amp; Specializations</text>

    <!-- 1. Frontend & Motion -->
    <g transform="translate(0, 68)">
      <text x="0" y="10" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.5">FRONTEND &amp; MOTION</text>
      <g transform="translate(0, 20)">
        <g class="chip-glow-1">
          <rect x="0" y="0" width="82" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="41" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">React 19</text>
        </g>
        <g transform="translate(90, 0)" class="chip-glow-2">
          <rect x="0" y="0" width="84" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="42" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Next.js 15</text>
        </g>
        <g transform="translate(182, 0)" class="chip-glow-1">
          <rect x="0" y="0" width="95" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="47" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">TypeScript</text>
        </g>
        <g transform="translate(285, 0)" class="chip-glow-2">
          <rect x="0" y="0" width="95" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="47" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Tailwind CSS</text>
        </g>
        <g transform="translate(388, 0)" class="chip-glow-1">
          <rect x="0" y="0" width="88" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="44" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Framer SVG</text>
        </g>
      </g>
    </g>

    <!-- 2. Backend & Runtimes -->
    <g transform="translate(0, 142)">
      <text x="0" y="10" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.5">BACKEND &amp; RUNTIMES</text>
      <g transform="translate(0, 20)">
        <g class="chip-glow-3">
          <rect x="0" y="0" width="80" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="40" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Node.js</text>
        </g>
        <g transform="translate(88, 0)" class="chip-glow-4">
          <rect x="0" y="0" width="84" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="42" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Python 3</text>
        </g>
        <g transform="translate(180, 0)" class="chip-glow-3">
          <rect x="0" y="0" width="80" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="40" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">FastAPI</text>
        </g>
        <g transform="translate(268, 0)" class="chip-glow-4">
          <rect x="0" y="0" width="84" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="42" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">GraphQL</text>
        </g>
        <g transform="translate(360, 0)" class="chip-glow-3">
          <rect x="0" y="0" width="116" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="58" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">RESTful Micro</text>
        </g>
      </g>
    </g>

    <!-- 3. Databases & DevOps -->
    <g transform="translate(0, 216)">
      <text x="0" y="10" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.5">DATABASE &amp; CLOUD INFRA</text>
      <g transform="translate(0, 20)">
        <g class="chip-glow-5">
          <rect x="0" y="0" width="98" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="49" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">PostgreSQL</text>
        </g>
        <g transform="translate(106, 0)" class="chip-glow-6">
          <rect x="0" y="0" width="70" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="35" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Redis</text>
        </g>
        <g transform="translate(184, 0)" class="chip-glow-5">
          <rect x="0" y="0" width="80" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="40" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Docker</text>
        </g>
        <g transform="translate(272, 0)" class="chip-glow-6">
          <rect x="0" y="0" width="88" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="44" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">CI/CD Git</text>
        </g>
        <g transform="translate(368, 0)" class="chip-glow-5">
          <rect x="0" y="0" width="108" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="54" y="18" fill="#f1f5f9" class="font-sans" font-size="11.5" font-weight="600" text-anchor="middle">Cloud / Edge</text>
        </g>
      </g>
    </g>

    <!-- 4. AI & Systems -->
    <g transform="translate(0, 290)">
      <text x="0" y="10" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.5">AI INTEGRATIONS &amp; SYSTEMS</text>
      <g transform="translate(0, 20)">
        <g class="chip-glow-1">
          <rect x="0" y="0" width="112" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="56" y="18" fill="#22d3ee" class="font-sans" font-size="11.5" font-weight="700" text-anchor="middle">Gemini API</text>
        </g>
        <g transform="translate(120, 0)" class="chip-glow-3">
          <rect x="0" y="0" width="115" height="28" rx="8" fill="#151226" stroke="#252d47" />
          <text x="57" y="18" fill="#a78bfa" class="font-sans" font-size="11.5" font-weight="700" text-anchor="middle">Vector Search</text>
        </g>
        <g transform="translate(243, 0)" class="chip-glow-5">
          <rect x="0" y="0" width="106" height="28" rx="8" fill="#1a1124" stroke="#252d47" />
          <text x="53" y="18" fill="#f472b6" class="font-sans" font-size="11.5" font-weight="700" text-anchor="middle">Agent SDKs</text>
        </g>
        <g transform="translate(357, 0)" class="chip-glow-2">
          <rect x="0" y="0" width="120" height="28" rx="8" fill="#121626" stroke="#252d47" />
          <text x="60" y="18" fill="#38bdf8" class="font-sans" font-size="11.5" font-weight="700" text-anchor="middle">Event Driven</text>
        </g>
      </g>
    </g>
  </g>
</svg>
